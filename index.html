<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>SATELLITE COMPRESSOR 🎬</title>
    <style>
        body { background: #0b0e14; color: #00ffcc; font-family: 'Courier New', monospace; text-align: center; padding: 40px; }
        .box { background: #161b22; border: 2px solid #00ffcc; padding: 30px; border-radius: 4px; display: inline-block; width: 90%; max-width: 550px; box-shadow: 0 0 15px rgba(0,255,204,0.2); }
        h2 { font-size: 22px; text-transform: uppercase; letter-spacing: 2px; color: #ff0055; margin-bottom: 25px; }
        input, select, button { width: 95%; padding: 12px; margin: 12px 0; border-radius: 4px; border: 1px solid #00ffcc; font-size: 15px; font-family: inherit; }
        input { background: #0d1117; color: #fff; text-align: left; direction: ltr; }
        select { background: #0d1117; color: #00ffcc; }
        button { background: #ff0055; color: white; border: none; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        button:hover { background: #ff3377; box-shadow: 0 0 10px #ff0055; }
        #status { margin-top: 20px; color: #ffaa00; font-size: 14px; }
    </style>
</head>
<body>

<div class="box">
    <h2>📡 CLOUD VIDEO COMPRESSOR v1.0</h2>
    
    <input type="text" id="serverUrl" placeholder="🔗 حط هنا رابط الـ ngrok الجديد">
    <hr style="border-color:#00ffcc; margin: 20px 0;">

    <input type="text" id="videoUrl" placeholder="📥 بيست رابط الفيديو هنا (يوتيوب، ريديت...)">
    <button onclick="checkVideo()">🔍 فحص الفيديو وميعاد الحجم</button>
    
    <div id="videoInfo" style="display:none;">
        <p id="videoTitle" style="color:#fff; font-weight:bold;"></p>
        <p> الحجم التقريبي: <span id="videoSize" style="color:#ff0055;"></span> MB</p>
        
        <label>🎛️ جودة الضغط المطلوبة:</label>
        <select id="preset">
            <option value="veryfast">ضغط طيارة (سريع جداً - حجم متوسط)</option>
            <option value="medium" selected>ضغط متوازن (حجم صغير - جودة ممتازة)</option>
            <option value="slow">عصر الفيديو (بطيء - أصغر حجم ممكن)</option>
        </select>
        <button id="compressBtn" onclick="startCompression()" style="background:#00ffcc; color:#0b0e14;">⚡ اضغط وحمل فوراً</button>
    </div>

    <div id="status"></div>
</div>

<script>
    async function checkVideo() {
        const server = document.getElementById('serverUrl').value.replace(/\/$/, "");
        const url = document.getElementById('videoUrl').value;
        if(!server || !url) return alert('املا الخانات الأول يا فنان!');
        
        document.getElementById('status').innerText = "⏳ جاري فحص الرابط...";
        try {
            const res = await fetch(`${server}/info`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'ngrok-skip-browser-warning': 'true' // السطر السحري لتخطي أي حظر
                },
                body: JSON.stringify({ url: url })
            });
            const data = await res.json();
            document.getElementById('videoTitle').innerText = data.title;
            document.getElementById('videoSize').innerText = data.size_mb;
            document.getElementById('videoInfo').style.display = "block";
            document.getElementById('status').innerText = "✅ تم الفحص بنجاح!";
        } catch(e) {
            document.getElementById('status').innerText = "❌ فشل الاتصال بالسيرفر الجديد.";
        }
    }

    async function startCompression() {
        const server = document.getElementById('serverUrl').value.replace(/\/$/, "");
        const url = document.getElementById('videoUrl').value;
        const preset = document.getElementById('preset').value;
        
        document.getElementById('status').innerText = "🚀 كولاب بيضغط الفيديو حالياً... استنى ثواني وهيتحمل لوحده!";
        try {
            const response = await fetch(`${server}/compress`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'ngrok-skip-browser-warning': 'true'
                },
                body: JSON.stringify({ url: url, preset: preset })
            });
            
            const blob = await response.blob();
            const downloadUrl = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = "compressed_video.mp4";
            document.body.appendChild(a);
            a.click();
            a.remove();
            document.getElementById('status').innerText = "📥 مبروك! تم التحميل.";
        } catch(e) {
            document.getElementById('status').innerText = "❌ حصلت مشكلة أثناء الضغط.";
        }
    }
</script>

</body>
</html>
